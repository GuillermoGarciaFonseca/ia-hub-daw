<header class="topbar">
  <a class="brand" routerLink="/">IA Hub</a>

  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    @for (ai of ais; track ai.slug) {
      <a [routerLink]="['/ia', ai.slug]" routerLinkActive="active">{{ ai.name }}</a>
    }
  </nav>
</header>

<main class="page">
  <router-outlet></router-outlet>
</main>
