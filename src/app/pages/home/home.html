<section class="hero">
  <h1>IA Hub</h1>
  <p>Un panel con {{ ais.length }} IAs distintas para comparar y aprender a usarlas con cabeza. 👀</p>
</section>

<section class="grid">
  @for (ai of ais; track ai.slug) {
    <a class="card" [routerLink]="['/ia', ai.slug]" [style.--accent]="ai.theme.accent">
      <div class="top">
        <h2>{{ ai.name }}</h2>
        <span class="tag">{{ ai.category }}</span>
      </div>
      <p class="desc">{{ ai.summary }}</p>
      <span class="cta">Entrar →</span>
    </a>
  }
</section>
